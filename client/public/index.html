  <body>
    <noscript><style>#notizo-preloader { display: none; }</style>You need to enable JavaScript to run this app.</noscript>

      <div class="pnum" aria-hidden="true"><span>0</span><b>0</b></div>

      <div class="preloader-help" hidden>
        <p>Loading is taking longer than expected. Check your connection or try again.</p>
        <button type="button">Reload Notizo</button>
      </div>
    </div>
    <div id="root"></div>
    <script src="%PUBLIC_URL%/preloader.js"></script>
